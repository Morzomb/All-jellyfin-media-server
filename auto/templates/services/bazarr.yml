services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/bazarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies # Accès aux films pour les sous-titres
      - ${COMMON_PATH}/sonarr/tv:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
