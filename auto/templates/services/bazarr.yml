services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/bazarr:/config
      - ${COMMON_PATH}/movies:/movies # Accès aux films pour les sous-titres
      - ${COMMON_PATH}/tv:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
